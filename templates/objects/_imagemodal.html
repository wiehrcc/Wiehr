{% load static %}

<div id="{{ modal_id|default:'zoomedinnow' }}" class="staringcontest">
    <button class="staringcontest-close" id="{{ close_id|default:'lookawaynow' }}">
        <img src="{% static 'images/entities/notok.svg' %}" alt="Close">
    </button>
    <img class="staringcontest-img" id="{{ image_id|default:'thebiggerpicture' }}"
         alt="Full size preview" loading="eager" decoding="async" />
</div>
